<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../src/styles/tokens.css">
<link rel="stylesheet" href="../src/styles/og-fonts.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: var(--paper); color: var(--ink); font-family: var(--font-body); }
  .frame { box-sizing: border-box; height: 100%; padding: 64px 72px; display: grid; grid-template-rows: auto 1fr auto; }
  .brand { display: flex; align-items: center; gap: 14px; font: 650 30px/1 var(--font-display); }
  h1 { margin: 0; align-self: center; font: 680 66px/1.04 var(--font-display); letter-spacing: -0.02em; max-width: 900px; }
  mark { background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%); color: inherit; }
  .twin { display: flex; align-items: center; gap: 28px; font: 500 46px/1 var(--font-mono); }
  .us { color: var(--us); text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: rgb(58 90 128 / 0.55); }
  .eu { color: var(--eu); }
  .arrow { color: var(--ink-muted); }
  .foot { display: flex; justify-content: space-between; align-items: end; }
  .stamp { font: 600 18px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--signal-ink); border: 2px solid currentColor; border-radius: 4px; padding: 8px 12px; transform: rotate(-2.5deg); }
  .rule { position: absolute; left: 72px; right: 72px; top: 128px; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
<div class="frame">
  <div class="brand"><svg width="56" height="35" viewBox="0 0 70 44" aria-hidden="true"><circle cx="24" cy="22" r="19" fill="none" stroke="#3A5A80" stroke-width="4"/><circle cx="46" cy="22" r="19" fill="none" stroke="#0E6B47" stroke-width="4"/></svg>ETF dvojčata</div>
  <h1>VOO si u většiny českých brokerů nekoupíte. Jeho evropské <mark>dvojče ano</mark>.</h1>
  <div class="foot">
    <div class="twin"><span class="us">VOO</span><span class="arrow">→</span><span class="eu">CSPX / VUAA</span></div>
    <span class="stamp" id="stamp"></span>
  </div>
</div>
<div class="rule"></div>
</body>
</html>
